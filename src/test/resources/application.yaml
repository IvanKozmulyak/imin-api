spring:
  data:
    # Mirrors src/main/resources/application.yaml — the test config shadows it
    # rather than extending it, so the Spring Data REST perimeter has to be
    # repeated here for SecurityPerimeterTest to exercise the real shape.
    rest:
      base-path: /api/v1
      detection-strategy: annotated
  profiles:
    active: test
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  ai:
    openai:
      api-key: test

openrouter:
  api-key: test
  base-url: https://openrouter.ai/api/v1
  model: openai/gpt-4o

replicate:
  model: ideogram-ai/ideogram-v3-turbo
  image:
    storage-dir: /tmp/imin-test-images

poster:
  text-validation:
    enabled: false
  compositor:
    enabled: false

# Probes the Resend domains API on every /actuator/health call; tests never reach Resend.
management:
  health:
    resend-tracking:
      enabled: false

imin:
  # The test config shadows main's, so the dashboard origin is repeated for the CORS test.
  cors:
    allowed-origin-patterns: https://dashboard.imin.wtf
  # No @Scheduled dispatch in test contexts; ShedLock proxies stay. Refused outside the test profile.
  scheduling:
    enabled: false
  # No Spring test context ticks the sweep; tests call sweep() on the bean.
  tier-stripe-sync:
    sweep-initial-delay-ms: 86400000
  stripe:
    # Dummy values — tests must mock all Stripe calls (no live network traffic in tests).
    secret-key: sk_test_dummy
    webhook-secret: whsec_dummy
    application-fee-bps: 500
    application-fee-fixed-minor: 99
    public-return-url-base: http://localhost:3000
    return-url-base: http://localhost:5173
  email:
    api-key: test-resend-key
    from-address: noreply@imin.test
    from-name: imin-test
    reply-to: ""
    app-base-url: http://localhost:3000
  ticket:
    # Deterministic test secret. Any 32+ char value works.
    signing-secret: test-ticket-signing-secret-32-bytes-zzzz
    recovery-window-days: 90
    recovery-max-per-hour: 5
    api-public-base-url: http://localhost:8080
  meta:
    # Dummy AES-256 key (base64 of 32 bytes) — CapiTokenCipher fails fast without it.
    # Any valid 32-byte base64 works; tests never persist a real CAPI token.
    enc-key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
  auth:
    session-ttl-days: 30
    # Cost 4 keeps hashing cheap in tests; below 10 is refused outside the test profile.
    bcrypt-strength: 4
  gate:
    token-ttl-days: 30
  ratelimit:
    login:
      capacity: 5
      window-minutes: 15
    ai-concept:
      capacity: 10
      window-minutes: 60
    verification-resend:
      capacity: 1000
      window-minutes: 15
    password-reset:
      capacity: 1000
      window-minutes: 15
    predictor-rescore:
      capacity: 1000
      window-minutes: 10
  predictor:
    # No test polls predictor_job on the scheduler; runner tests call tick() themselves.
    jobs-poll-enabled: false
    # This file shadows the main one, so the flag is set here; calls go to .invalid and come back null.
    weather-enabled: true
    openweather:
      api-key: test-not-a-key
      base-url: https://openweather.test.invalid
    calendar:
      # Off so no Spring test calls the calendar sources; sync tests use MockRestServiceServer.
      sync-enabled: false
  media:
    enabled: false
    bucket: test
    endpoint: https://test.invalid
    region: auto
    access-key-id: test
    secret-access-key: test
    public-url-prefix: https://test-media.invalid/
  audience-plan:
    enabled: true
    beta-org-ids: ""
    logic-file: classpath:audienceplan/logic-v1.yaml
    priors-file: classpath:audienceplan/priors-v1.yaml
    genres-file: classpath:audienceplan/genres-v1.yaml
    sends-enabled: false
    soft-opt-in-enabled: false
    retention-job-enabled: false
    consent-gate-all-campaigns: false
    # Off so no Spring test reaches OpenRouter; summary tests switch it on with a stubbed ChatClient.
    summary-enabled: false
    summary-model: ""
    summary-price-input-usd-per-mtok: ""
    summary-price-output-usd-per-mtok: ""
    summary-daily-cap-per-org: ""
    summary-timeout: ""
    legal-identity-all-campaigns: false
    portrait-model: ""
    portrait-price-input-usd-per-mtok: ""
    portrait-price-output-usd-per-mtok: ""
    portrait-timeout: ""
    portrait-daily-cap-per-org: ""
    # 0 so no Spring test reaches OpenRouter; portrait research tests use stubs or a local server.
    portrait-daily-cap-global: 0
    portrait-refresh-batch: ""
    consent-confirmation-emails-enabled: false
