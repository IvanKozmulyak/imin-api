spring:
  profiles:
    active: test
  docker:
    compose:
      enabled: false
  datasource:
    # NOTE: the test JVM is pinned to UTC by maven-surefire's argLine in pom.xml.
    # That is not a preference — H2 interprets a bound TIMESTAMP WITH TIME ZONE
    # value in the session time zone, which it takes from the JVM, so on a
    # machine at UTC+2 an Instant written as 12:00:00Z was stored as `12:00:00+02`
    # and read back as 10:00:00Z. Every timestamptz column was silently skewed by
    # the developer's UTC offset, in the same direction on write and read, so
    # nothing with a long TTL ever noticed. Do not "simplify" the argLine away.
    url: jdbc:h2:mem:imin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  ai:
    openai:
      api-key: test

openrouter:
  api-key: test
  base-url: https://openrouter.ai/api/v1
  model: openai/gpt-4o

replicate:
  api-token: test-token
  model: ideogram-ai/ideogram-v3-turbo
  image:
    storage-dir: /tmp/imin-test-images

poster:
  text-validation:
    enabled: false
  compositor:
    enabled: false

imin:
  stripe:
    # Dummy values — tests must mock all Stripe calls (no live network traffic in tests).
    secret-key: sk_test_dummy
    webhook-secret: whsec_dummy
    application-fee-bps: 500
    application-fee-fixed-minor: 99
    public-return-url-base: http://localhost:3000
    return-url-base: http://localhost:5173
  email:
    api-key: test-resend-key
    from-address: noreply@imin.test
    from-name: imin-test
    reply-to: ""
    app-base-url: http://localhost:3000
  ticket:
    # Deterministic test secret. Any 32+ char value works.
    signing-secret: test-ticket-signing-secret-32-bytes-zzzz
    recovery-window-days: 90
    recovery-max-per-hour: 5
    api-public-base-url: http://localhost:8080
  meta:
    # Dummy AES-256 key (base64 of 32 bytes) — CapiTokenCipher fails fast without it.
    # Any valid 32-byte base64 works; tests never persist a real CAPI token.
    enc-key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
  api:
    base-path: /api/v1
  auth:
    session-ttl-days: 30
  gate:
    token-ttl-days: 30
  ratelimit:
    login:
      capacity: 5
      window-minutes: 15
    ai-concept:
      capacity: 10
      window-minutes: 60
    verification-resend:
      capacity: 1000
      window-minutes: 15
    password-reset:
      capacity: 1000
      window-minutes: 15
    predictor-rescore:
      capacity: 1000
      window-minutes: 10
  media:
    enabled: false
    bucket: test
    endpoint: https://test.invalid
    region: auto
    access-key-id: test
    secret-access-key: test
    public-url-prefix: https://test-media.invalid/
