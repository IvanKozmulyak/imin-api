spring:
  profiles:
    active: test
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:imin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  ai:
    openai:
      api-key: test

openrouter:
  api-key: test
  base-url: https://openrouter.ai/api/v1
  model: openai/gpt-4o

replicate:
  api-token: test-token
  model: ideogram-ai/ideogram-v3-turbo
  image:
    storage-dir: /tmp/imin-test-images

poster:
  references:
    # No network calls during tests: skip startup style-descriptor analysis.
    analyze-on-startup: false

imin:
  stripe:
    # Dummy values — tests must mock all Stripe calls (no live network traffic in tests).
    secret-key: sk_test_dummy
    webhook-secret: whsec_dummy
    application-fee-bps: 500
    application-fee-fixed-minor: 99
    public-return-url-base: http://localhost:3000
    return-url-base: http://localhost:5173
  reference-analyzer:
    model-id: openai/gpt-4o-mini
  email:
    api-key: test-resend-key
    from-address: noreply@imin.test
    from-name: imin-test
    reply-to: ""
    app-base-url: http://localhost:3000
  ticket:
    # Deterministic test secret. Any 32+ char value works.
    signing-secret: test-ticket-signing-secret-32-bytes-zzzz
    recovery-window-days: 90
    recovery-max-per-hour: 5
    api-public-base-url: http://localhost:8080
  api:
    base-path: /api/v1
  auth:
    session-ttl-days: 30
  gate:
    token-ttl-days: 30
  ratelimit:
    login:
      capacity: 5
      window-minutes: 15
    ai-concept:
      capacity: 10
      window-minutes: 60
    verification-resend:
      capacity: 1000
      window-minutes: 15
    password-reset:
      capacity: 1000
      window-minutes: 15
  media:
    enabled: false
    bucket: test
    endpoint: https://test.invalid
    region: auto
    access-key-id: test
    secret-access-key: test
    public-url-prefix: https://test-media.invalid/
