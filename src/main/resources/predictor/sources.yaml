# Outside datasets the predictor uses, served by GET /api/v1/public/predictor/sources.
# List a source only in the change that makes it live, with the gate that turns it off.
# syncPrefix (optional): reference_calendar.source_url prefix whose latest synced_at is the source's lastUpdated.
reviewedOn: 2026-10-01
sources:
  - id: calendrier-api-gouv
    name: calendrier.api.gouv.fr
    usedFor: [public_holidays, bridge_days]
    licence: Licence Ouverte 2.0
    licenceUrl: https://www.etalab.gouv.fr/licence-ouverte-open-licence/
    creditLine: "Jours fériés : DINUM (calendrier.api.gouv.fr), Licence Ouverte 2.0"
    url: https://calendrier.api.gouv.fr/jours-feries/
    syncPrefix: https://calendrier.api.gouv.fr/jours-feries/
    gate: date-check
  - id: fr-en-calendrier-scolaire
    name: Calendrier scolaire (data.education.gouv.fr)
    usedFor: [school_holidays]
    licence: Licence Ouverte 2.0
    licenceUrl: https://www.etalab.gouv.fr/licence-ouverte-open-licence/
    creditLine: "Calendrier scolaire : Ministère de l'Éducation nationale (data.education.gouv.fr), Licence Ouverte 2.0"
    url: https://data.education.gouv.fr/explore/dataset/fr-en-calendrier-scolaire/
    syncPrefix: https://data.education.gouv.fr/explore/dataset/fr-en-calendrier-scolaire/
    gate: date-check
  - id: openholidays
    name: OpenHolidays API
    usedFor: [public_holidays]
    licence: ODbL 1.0
    licenceUrl: https://opendatacommons.org/licenses/odbl/1-0/
    creditLine: "Public holidays of neighbouring countries: contains data from OpenHolidays API (openholidaysapi.org), ODbL"
    url: https://www.openholidaysapi.org/
    syncPrefix: https://openholidaysapi.org/
    gate: date-check
  # Terms (football-data.org/about, "Terms & Conditions", last updated 2018-06-01) §7.1 sets this credit line, checked 2026-10-01.
  # Commercial use unconfirmed (pending with Ivan); gate stays off until confirmed.
  - id: football-data
    name: football-data.org
    usedFor: [football_fixtures]
    licence: football-data.org General Terms and Conditions
    licenceUrl: https://www.football-data.org/about
    creditLine: "Football data provided by the Football-Data.org API"
    url: https://www.football-data.org/
    syncPrefix: https://api.football-data.org/v4/competitions/
    gate: football
  - id: iana-tz
    name: IANA Time Zone Database
    usedFor: [dst]
    licence: Public domain
    licenceUrl: https://github.com/eggert/tz/blob/main/LICENSE
    creditLine: "Time zones: IANA tz database (public domain)"
    url: https://www.iana.org/time-zones
    gate: date-check
  - id: openjdk-hijrah
    name: OpenJDK Umm al-Qura calendar tables
    usedFor: [hijri]
    licence: GPLv2 + Classpath Exception
    licenceUrl: https://openjdk.org/legal/gplv2+ce.html
    creditLine: "Hijri dates: OpenJDK Umm al-Qura tables (GPLv2 + Classpath Exception)"
    url: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/time/chrono/HijrahChronology.java
    gate: date-check
  - id: open-meteo
    name: Open-Meteo
    usedFor: [weather]
    licence: CC BY 4.0
    licenceUrl: https://creativecommons.org/licenses/by/4.0/
    creditLine: "Weather data by Open-Meteo.com (CC BY 4.0)"
    url: https://open-meteo.com/
    gate: weather
  # CC0 per the Analytics API access policy ("Data licensing"), checked 2026-10-01; CC0 asks for no update date.
  - id: wikimedia-pageviews
    name: Wikimedia Pageviews
    usedFor: [genre_interest]
    licence: CC0 1.0
    licenceUrl: https://creativecommons.org/publicdomain/zero/1.0/
    creditLine: "Genre interest: Wikimedia Pageviews (Wikimedia Foundation), CC0 1.0"
    url: https://doc.wikimedia.org/generated-data-platform/aqs/analytics-api/
    gate: wikimedia
  # Agenda pages (openagenda.com/fr/ville-de-lille, /metropole-europeenne-de-lille) say their content "provient de l'agenda
  # <name> sur OpenAgenda et est utilisable selon le principe de la licence ouverte"; checked 2026-10-01.
  - id: openagenda
    name: OpenAgenda (Ville de Lille, Métropole Européenne de Lille)
    usedFor: [local_events]
    licence: Licence Ouverte 2.0
    licenceUrl: https://www.etalab.gouv.fr/licence-ouverte-open-licence/
    creditLine: "Agendas : Ville de Lille, Métropole Européenne de Lille (openagenda.com), Licence Ouverte 2.0"
    url: https://openagenda.com/
    gate: openagenda
  # Dataset metadata (license "Open Database License (ODbL)", publisher "Direction de la Communication - Ville de Paris"),
  # checked 2026-10-01.
  - id: quefaireaparis
    name: Que Faire à Paris (opendata.paris.fr)
    usedFor: [local_events]
    licence: ODbL 1.0
    licenceUrl: https://opendatacommons.org/licenses/odbl/1-0/
    creditLine: "Que Faire à Paris : Ville de Paris, Direction de la Communication (opendata.paris.fr), ODbL"
    url: https://opendata.paris.fr/explore/dataset/que-faire-a-paris-/
    gate: quefaireaparis
