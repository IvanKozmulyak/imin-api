# Genre profiles for the date check, one per event genre bucket (audienceplan/genres-v1.yaml whitelist).
# Every field carries exactly one marker: `sourced: <url>` or `estimate: true`.
# All values below are conservative estimates pending product review; the UI must never show them as facts.
# sub_genres is a draft taxonomy, pending review.
# communities: ISO-3166 alpha-2 codes of countries whose national days matter to this scene's audience
# (question 5.1); never used to target or label people.
version: 1
buckets:
  "house & techno":
    sub_genres: [techno, house, hard techno, minimal, melodic techno]
    audience_age:       { value: [21, 35], estimate: true }
    communities:        { value: [], estimate: true }
    typical_price_eur:  { value: [12, 25], estimate: true }
    typical_start_hour: { value: 23, estimate: true }
    buying_lead_days:   { value: 7, estimate: true }
