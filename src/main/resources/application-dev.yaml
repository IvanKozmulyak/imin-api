spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mydatabase}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: false

logging:
  level:
    com.imin.iminapi: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  port: ${SERVER_PORT:8085}

# Buyer-site origin for campaign links (unsubscribe + tickets button) — localhost in dev,
# prod-safe default (https://app.imin.wtf) in application.yaml.
imin.marketing.unsubscribe-base-url: http://localhost:3000
# Local-dev URL overrides (prod-safe defaults live in application.yaml)
imin.stripe.public-return-url-base: http://localhost:3000
imin.email.app-base-url: http://localhost:5173
imin.email.buyer-site-base-url: http://localhost:3000
