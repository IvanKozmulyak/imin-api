# AI Studio Poster Style Base — the Vibe Library.
# Each vibe = one selectable option in AI Studio Stage 1. Fields are prompt building blocks.
# Loaded by VibeLibrary. Source: Ivan's "AI Studio Poster Style Base" draft (2026-06-02).
#
# `references`  — curated reference flyers (folder or explicit files) used to condition the model.
# `text_only`   — true when no curated references exist yet (runs from the structured preset alone).
# `style_id`    — provider reusable trained-style id (filled once trained; null until then).
# `layout_template` — per-vibe text-overlay layout (see P2 LayoutDocument).

fallback_vibe: liquid_melodic

universal_rules:
  aspect_ratios: ["4:5", "1:1", "9:16", "16:9"]
  negative_prompt: "text artifacts, gibberish text, watermark, logo, signature, deformed faces, extra limbs, low-res, jpeg artifacts, blurry, stock-photo look, generic clipart"
  ip_rule: "Never use 'in the style of <real artist / label / club>'; never reference real venues, brands, or copyrighted characters. Keep all descriptions generic and original."

vibes:
  - id: brutalist_techno
    name: "Brutalist Techno"
    genres: [techno, hard techno, warehouse, peak-time]
    visual_style: "raw exposed concrete, industrial warehouse, harsh single-source lighting, heavy film grain, high-contrast photography, oversized negative space, stark and severe"
    palette: ["#0A0A0A", "#1C1C1C", "#E8E8E8", "#FF2D00"]
    typography: "oversized condensed grotesk, all caps, tight tracking, brutalist grid"
    composition: "giant centered or top-aligned headline, lots of empty space, single dominant texture"
    mood_tags: [raw, severe, monolithic, cold, dark]
    avoid: [soft lighting, decoration, warmth, generic flyer tropes]
    model_route: recraft
    references: ["reference-images/Brutalist Techno"]
    style_id: null
    layout_template: brutalist
    text_only: false

  - id: berlin_minimal
    name: "Berlin Minimal"
    genres: [minimal techno, dub techno, microhouse]
    visual_style: "near-empty field, extreme minimalism, precise tiny typographic marks, subtle texture or single thin line, gallery-like restraint"
    palette: ["#000000", "#FFFFFF", "#7A7A7A"]
    typography: "very small monospaced or thin grotesk, wide letter-spacing, precise alignment"
    composition: "maximal negative space, one small focal element, asymmetric balance"
    mood_tags: [minimal, precise, intellectual, quiet, austere]
    avoid: [imagery clutter, busy layouts, photographic backgrounds, generic flyer tropes]
    model_route: recraft
    references: ["reference-images/Berlin Minimal"]
    style_id: null
    layout_template: berlin_minimal
    text_only: false

