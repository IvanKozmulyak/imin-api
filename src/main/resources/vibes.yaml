    avoid: [matte textures, minimalism, realism, generic flyer tropes]
    # CHOSEN per style card: references are glossy chrome / liquid-metal 3D renders (no photographic
    # human heroes), so a realistic_image substyle would lose the render look — keep the trained style.
    subject: "A single glossy chrome / liquid-metal 3D form — blob chain, splash, twisted knot, or a sculpted reflective head — floating over a saturated mono background, with huge bold type layered across it. Object-and-render-led, not flash-photo crowds."
    style_mode: trained_style_id
    substyle: null
    model_route: recraft
    references: ["reference-images/Acid Rave - Y2K"]
    style_id: null
    layout_template: acid_rave_y2k
    text_only: false

