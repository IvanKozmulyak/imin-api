logging:
  level:
    com.imin.iminapi.service.poster: DEBUG

spring:
  application:
    name: imin-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6380}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB

replicate:
  # Retained only for the local-disk image-storage fallback (PosterImageStorage + WebConfig) and the
  # render concurrency cap. The Replicate image-prediction path was removed with the native Ideogram V3
  # migration.
  api-token: ${REPLICATE_API_TOKEN:}
  image:
    storage-dir: ${REPLICATE_IMAGE_STORAGE_DIR:./generated-images}
  timeout-seconds: 65
  max-concurrent: 6

# Native Ideogram V3 render API (sole renderer). QUALITY for the initial generate; TURBO for the
# corrective remix that only fixes baked text. Exactly one style control: reference images win,
# style_preset is the no-refs fallback.
ideogram:
  api-key: ${IDEOGRAM_API_KEY:}
  base-url: ${IDEOGRAM_BASE_URL:https://api.ideogram.ai}
  copyright-detection: ${IDEOGRAM_COPYRIGHT_DETECTION:true}
  max-references: ${IDEOGRAM_MAX_REFERENCES:3}
  generate:
    # TURBO by default — QUALITY costs 3x and the text gate + corrective remix are the quality net.
    rendering-speed: ${IDEOGRAM_GENERATE_RENDERING_SPEED:TURBO}
  remix:
    rendering-speed: ${IDEOGRAM_REMIX_RENDERING_SPEED:TURBO}
    image-weight: ${IDEOGRAM_REMIX_IMAGE_WEIGHT:70}
  character:
    # color_palette is NEVER sent with a character reference — Ideogram rejects the combination
    # with a 400 (confirmed in production 2026-06-12); brand colours ride the prompt channel.
    seed: ${IDEOGRAM_CHARACTER_SEED:false}
    style-control: ${IDEOGRAM_CHARACTER_STYLE_CONTROL:false}

poster:
  palette-regrade:
    # DJ-mode only: the char-ref render can't carry color_palette, so the accepted image gets one
    # extra TURBO remix (no char ref, WITH color_palette) to apply the brand colours. Text-gate
    # re-checked; falls back to the pre-regrade render if the typography broke.
    enabled: ${POSTER_PALETTE_REGRADE_ENABLED:true}
    image-weight: ${POSTER_PALETTE_REGRADE_IMAGE_WEIGHT:85}
  references:
    # Curated reference flyers are loaded per-vibe from vibes.yaml (folders under
    # reference-images/). Cap how many flyers per vibe are sent to the image model.
    max-per-tag: ${POSTER_MAX_REFERENCES_PER_TAG:5}
  style-cards:
    # Committed per-vibe style cards (sampling pools + palette extracted from the reference flyers),
    # loaded by StyleCardLibrary at startup. Authored once via the @Profile("tools") StyleCardGenerator.
    location: ${POSTER_STYLE_CARDS_LOCATION:classpath*:vibes/style-cards/*.yaml}
  text-validation:
    # Legibility + invented-text (vision) gate — HARD. Enforced server-side: the gate fails on ANY
    # missing required string or invented/garbled text, regardless of the model's own `accepted` verdict;
    # a failure triggers a corrective remix (not a blind reseed). Uses a strong vision model because the
    # old gpt-4o-mini under-read dense poster type and false-passed hallucinated text. For a cheaper
    # reader set POSTER_TEXT_VALIDATION_MODEL=google/gemini-2.0-flash-001 (strong OCR, low cost).
    enabled: ${POSTER_TEXT_VALIDATION_ENABLED:true}
    model: ${POSTER_TEXT_VALIDATION_MODEL:openai/gpt-4o}
    # Server-side tolerance for invented text items before the gate fails. 0 = reject any invented text.
    max-extra-text-items: ${POSTER_TEXT_VALIDATION_MAX_EXTRA_TEXT_ITEMS:0}
    # Cap on the gate's response length. Bounds a runaway OCR transcription (texture-heavy posters can
    # make the model enumerate garbled "text" until it overruns and truncates the verdict JSON mid-string).
    # A legitimate verdict is a few short strings, well under this. An unusable verdict is treated as a
    # non-acceptance (corrective remix / best-effort), never a fatal variant error.
    max-tokens: ${POSTER_TEXT_VALIDATION_MAX_TOKENS:1500}
  style-validation:
    # Style-adherence (vision) gate — SOFT (hero present, medium/palette match). ENABLED for the
    # Ideogram V3 flow; a failure is accepted best-effort. Cheap model like the text gate.
    enabled: ${POSTER_STYLE_VALIDATION_ENABLED:true}
    model: ${POSTER_STYLE_VALIDATION_MODEL:openai/gpt-4o-mini}
  validation:
    # Unified regeneration budget shared by the legibility + style gates (total per variant; cost/latency
    # control, keep <= 2). POSTER_TEXT_VALIDATION_MAX_REGENERATIONS is kept as a deprecated alias.
    max-regenerations: ${POSTER_VALIDATION_MAX_REGENERATIONS:${POSTER_TEXT_VALIDATION_MAX_REGENERATIONS:2}}
  render:
    # Concurrency cap across in-flight Ideogram renders. Alias keeps the old REPLICATE_MAX_CONCURRENT working.
    max-concurrent: ${POSTER_RENDER_MAX_CONCURRENT:${REPLICATE_MAX_CONCURRENT:6}}
  provider-routing:
    # When true, each vibe's model_route selects the image provider.
    # Default false keeps all concept/poster generation on RECRAFT, which is the
    # reference-first path. Use explicit routing only for provider experiments/fallbacks.
    enabled: ${POSTER_PROVIDER_ROUTING_ENABLED:false}

openrouter:
  api-key: ${OPENROUTER_API_KEY}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
  # Stage-1 art director. Claude Sonnet 4.6 produces stronger, less boilerplate poster concepts than
  # gpt-4o-mini. Vision gates stay on openai/gpt-4o-mini (configured under poster.*-validation.model).
  model: ${OPENROUTER_MODEL:anthropic/claude-sonnet-4.6}
  # Lower temperature → stable concept JSON + coherent art direction. The provider
  # otherwise defaults near 1.0 (noisy, inconsistent prompts). Tune via env.
  temperature: ${OPENROUTER_TEMPERATURE:0.6}

openai:
  image:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_IMAGE_MODEL:gpt-image-1}

recraft:
  # Recraft image-gen + per-vibe style training. Required for the default
  # reference-first poster path and for training a vibe style.
  api-key: ${RECRAFT_API_KEY:}
  base-url: ${RECRAFT_BASE_URL:https://external.api.recraft.ai/v1}
  model: ${RECRAFT_MODEL:recraftv3}
  # Base style used for untrained vibes (style_id absent) and as the training
  # base for POST /styles. One of: realistic_image | digital_illustration |
  # vector_illustration | icon.
  base-style: ${RECRAFT_BASE_STYLE:realistic_image}

imin:
  stripe:
    # STRIPE_SECRET_KEY (sk_test_... locally, sk_live_... in prod). Required — see README.
    secret-key: ${STRIPE_SECRET_KEY:}
    # Signing secret for /api/v1/stripe/webhook/v1 (V1 payments events:
    # payment_intent.succeeded / .payment_failed, checkout.session.expired).
    # Printed by `stripe listen` for the V1 endpoint.
    webhook-secret-v1: ${STRIPE_WEBHOOK_SECRET_V1:}
    # Signing secret for /api/v1/stripe/webhook/v2 (V2 thin events:
    # v2.core.account.requirements.updated, v2.core.account.recipient.capability_status_updated).
    # Printed by `stripe listen` for the V2 endpoint.
    webhook-secret-v2: ${STRIPE_WEBHOOK_SECRET_V2:}
    # Signing secret for the SECOND endpoint on the same /webhook/v1 URL, scoped to
    # "Connected accounts" (delivers payout.* — they fire on the connected account).
    # Tried as a fallback after webhook-secret-v1. OPTIONAL: blank => payout.* reconciliation
    # is dark until a connect-scoped endpoint is added and its whsec set here.
    webhook-secret-connect: ${STRIPE_WEBHOOK_SECRET_CONNECT:}
    # Platform's percentage cut, in basis points. 500 = 5%.
    application-fee-bps: ${STRIPE_APPLICATION_FEE_BPS:500}
    # Flat per-ticket platform fee in minor units (cents). 99 = €0.99.
    application-fee-fixed-minor: ${STRIPE_APPLICATION_FEE_FIXED_MINOR:99}
    # Base URL for the buyer's success/cancel pages (imin-public).
    public-return-url-base: ${STRIPE_PUBLIC_RETURN_URL_BASE:http://localhost:3000}
    # Fallback base URL for the organizer's Connect onboarding return/refresh (imin-webapp).
    return-url-base: ${STRIPE_RETURN_URL_BASE:http://localhost:5173}
    # Stripe Checkout session TTL in minutes. Stripe's documented minimum is 30
    # (anything shorter is rejected). Mirrored into TicketReservation.expires_at
    # so the ReservationSweeper releases stale holds even when webhooks miss.
    checkout-session-ttl-minutes: ${STRIPE_CHECKOUT_SESSION_TTL_MINUTES:30}
    # Master kill-switch for Track-B manual payouts (Phase 1/2). DEFAULT FALSE:
    # when false NOTHING flips an account schedule and no payout is ever created
    # (code inert on deploy). Only enable in prod AFTER the test-mode spike passes.
    payout-schedule-manual: ${STRIPE_PAYOUT_SCHEDULE_MANUAL:false}
    # Days after event.endsAt before the post-event payout job fires (EU card
    # availability lag). Default 3.
    payout-buffer-days: ${STRIPE_PAYOUT_BUFFER_DAYS:3}
    # Timezone for resolving the payout buffer deadline (the business deadline,
    # not the event's local zone). Default Europe/Amsterdam.
    payout-zone: ${STRIPE_PAYOUT_ZONE:Europe/Amsterdam}
  email:
    api-key: ${RESEND_API_KEY:}
    from-address: ${IMIN_EMAIL_FROM_ADDRESS:noreply@imin.local}
    from-name: ${IMIN_EMAIL_FROM_NAME:imin}
    reply-to: ${IMIN_EMAIL_REPLY_TO:}
    # Organizer dashboard host (imin-webapp). Used in password-reset and
    # account-notification emails. In prod: https://dashboard.imin.wtf.
    app-base-url: ${IMIN_APP_BASE_URL:http://localhost:3000}
    # Public buyer site host (imin-public). Used in ticket-issuance, free-flow
    # confirmation, and order-recovery emails. In prod: https://app.imin.wtf.
    buyer-site-base-url: ${IMIN_BUYER_SITE_BASE_URL:http://localhost:3000}
    # Imin's internal notification inbox for new refund requests. When blank,
    # falls back to reply-to, then from-address (see EmailProperties#resolveRefundRequestInbox).
    refund-request-inbox: ${IMIN_REFUND_REQUEST_INBOX:}
    # Refund-request magic-link TTL in minutes. Default 60; bump via env in incident response.
    refund-request-token-ttl-minutes: ${IMIN_REFUND_REQUEST_TOKEN_TTL_MINUTES:60}
  marketing:
    # Bulk-email sending identity — a marketing subdomain (e.g. news.imin.wtf)
    # with its OWN SPF/DKIM so bulk sends never touch the transactional auth-email
    # reputation. In prod set IMIN_MARKETING_FROM_ADDRESS to a verified Resend sender.
    from-address: ${IMIN_MARKETING_FROM_ADDRESS:noreply@news.imin.local}
    from-name: ${IMIN_MARKETING_FROM_NAME:imin}
    # Public host (imin-public) that serves the /optout confirmation page and hosts
    # the RFC 8058 unsubscribe link. In prod: https://app.imin.wtf.
    unsubscribe-base-url: ${IMIN_MARKETING_UNSUBSCRIBE_BASE_URL:http://localhost:3000}
  ticket:
    # HMAC-SHA256 secret used to tamper-evidence QR payloads. 32+ bytes of entropy.
    # Required at boot — QrPayloadSigner throws if blank.
    signing-secret: ${IMIN_TICKET_SIGNING_SECRET:}
    # Self-recovery window — only orders newer than this are re-mailed.
    recovery-window-days: ${IMIN_TICKET_RECOVERY_WINDOW_DAYS:90}
    # Self-recovery rate limit per (email, hour) and (ip, hour).
    recovery-max-per-hour: ${IMIN_TICKET_RECOVERY_MAX_PER_HOUR:5}
    # The API's own public base URL (no trailing slash). Used to build absolute
    # QR / pkpass links the buyer's email client can fetch. Distinct from
    # imin.email.buyer-site-base-url (the buyer site, which serves the ticket
    # HTML page) and imin.email.app-base-url (the organizer dashboard).
    api-public-base-url: ${IMIN_API_PUBLIC_BASE_URL:http://localhost:8080}
  public:
    # Total remaining inventory (across enabled tiers) at or below which a
    # not-sold-out event is flagged lowStock on GET /api/v1/public/events,
    # so the buyer site can show an "Almost gone" badge. 0 disables the badge.
    low-stock-threshold: ${IMIN_PUBLIC_LOW_STOCK_THRESHOLD:10}
  apple-wallet:
    # Apple Pass Type ID, e.g. pass.com.imin.ticket. Required for /apple-wallet.pkpass
    # to serve a pass; when blank the endpoint returns 503 and the email template
    # suppresses the "Add to Apple Wallet" CTA.
    pass-type-id: ${APPLE_WALLET_PASS_TYPE_ID:}
    # Apple Developer team identifier.
    team-id: ${APPLE_WALLET_TEAM_ID:}
    # Base64-encoded PKCS#12 (.p12) that holds the Pass Type ID cert + private key.
    cert-p12-base64: ${APPLE_WALLET_CERT_P12_BASE64:}
    cert-password: ${APPLE_WALLET_CERT_PASSWORD:}
    # Base64-encoded Apple WWDR intermediate certificate (PEM).
    wwdr-pem-base64: ${APPLE_WALLET_WWDR_PEM_BASE64:}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,https://imin-webapp.vercel.app,https://imin-webapp-*.vercel.app,https://dashboard.imin.wtf,https://imin.wtf,https://www.imin.wtf,https://imin-public.vercel.app,https://imin-public-*.vercel.app,https://t.imin.wtf}
  api:
    base-path: /api/v1
  auth:
    session-ttl-days: 30
  gate:
    # Gate-scanner bearer-token lifetime. Gate phones live at venues and reboot
    # rarely; default 30 days. Override with IMIN_GATE_TOKEN_TTL_DAYS.
    token-ttl-days: ${IMIN_GATE_TOKEN_TTL_DAYS:30}
  ratelimit:
    login:
      capacity: 5
      window-minutes: 15
    ai-concept:
      capacity: 10
      window-minutes: 60
    verification-resend:
      capacity: 3
      window-minutes: 15
    password-reset:
      capacity: 3
      window-minutes: 15
    checkout:
      # Public unauthenticated buyer checkout, keyed per client IP (forward-headers-strategy=framework
      # makes getRemoteAddr the real client IP in prod). Generous for a real buyer (a few retries)
      # while throttling a loop that would mint unbounded Stripe Coupons/Sessions and lock inventory.
      capacity: 20
      window-minutes: 5
  media:
    enabled: ${MEDIA_ENABLED:true}
    bucket: ${R2_BUCKET:imin-media-dev}
    endpoint: ${R2_ENDPOINT:}
    region: ${R2_REGION:auto}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-url-prefix: ${R2_PUBLIC_URL_PREFIX:}
  meta:
    # Meta Graph API version for the CAPI events endpoint. Parameterized so we never
    # bake in a forced migration; v25.0 is current as of 2026-07 (spec §5).
    graph-api-version: ${META_GRAPH_API_VERSION:v25.0}
    base-url: ${META_GRAPH_BASE_URL:https://graph.facebook.com}
    # base64 of a 32-byte AES-256 key for the write-only CAPI token.
    enc-key: ${META_CAPI_ENC_KEY:}
    # Poller batch size and backoff bounds (spec §5: 1m -> 12h, dead after 5).
    poll-batch-size: ${META_CAPI_POLL_BATCH:50}
    max-attempts: ${META_CAPI_MAX_ATTEMPTS:5}

sentry:
  dsn: ${SENTRY_DSN:}
  enabled: false
  send-default-pii: false
  traces-sample-rate: 0.0
