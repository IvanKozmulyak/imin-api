logging:
  level:
    com.imin.iminapi.service.poster: DEBUG

spring:
  application:
    name: imin-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6380}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB

replicate:
  api-token: ${REPLICATE_API_TOKEN:}
  image:
    storage-dir: ${REPLICATE_IMAGE_STORAGE_DIR:./generated-images}
  models:
    ideogram-turbo: ${IDEOGRAM_TURBO_MODEL:ideogram-ai/ideogram-v3-turbo}
    ideogram-quality: ${IDEOGRAM_QUALITY_MODEL:ideogram-ai/ideogram-v3-quality}
  timeout-seconds: 65
  max-concurrent: 6

poster:
  references:
    config-file: classpath:poster-references.yaml
  overlay:
    qr-size-px: 120
    address-max-chars: 80
  generation:
    variant-count: 3
    retry-on-validation-failure: 1

openrouter:
  api-key: ${OPENROUTER_API_KEY}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
  model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}

openai:
  image:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_IMAGE_MODEL:gpt-image-1}

imin:
  stripe:
    # STRIPE_SECRET_KEY (sk_test_... locally, sk_live_... in prod). Required — see README.
    secret-key: ${STRIPE_SECRET_KEY:}
    # STRIPE_WEBHOOK_SECRET (whsec_...). Printed by `stripe listen --thin-events ...`.
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Platform's percentage cut, in basis points. 500 = 5%.
    application-fee-bps: ${STRIPE_APPLICATION_FEE_BPS:500}
    # Flat per-ticket platform fee in minor units (cents). 99 = €0.99.
    application-fee-fixed-minor: ${STRIPE_APPLICATION_FEE_FIXED_MINOR:99}
    # Base URL for the buyer's success/cancel pages (imin-public).
    public-return-url-base: ${STRIPE_PUBLIC_RETURN_URL_BASE:http://localhost:3000}
    # Fallback base URL for the organizer's Connect onboarding return/refresh (imin-webapp).
    return-url-base: ${STRIPE_RETURN_URL_BASE:http://localhost:5173}
  reference-analyzer:
    model-id: ${IMIN_REFERENCE_ANALYZER_MODEL:openai/gpt-4o-mini}
  email:
    api-key: ${RESEND_API_KEY:}
    from-address: ${IMIN_EMAIL_FROM_ADDRESS:noreply@imin.local}
    from-name: ${IMIN_EMAIL_FROM_NAME:imin}
    reply-to: ${IMIN_EMAIL_REPLY_TO:}
    app-base-url: ${IMIN_APP_BASE_URL:http://localhost:3000}
  ticket:
    # HMAC-SHA256 secret used to tamper-evidence QR payloads. 32+ bytes of entropy.
    # Required at boot — QrPayloadSigner throws if blank.
    signing-secret: ${IMIN_TICKET_SIGNING_SECRET:}
    # Self-recovery window — only orders newer than this are re-mailed.
    recovery-window-days: ${IMIN_TICKET_RECOVERY_WINDOW_DAYS:90}
    # Self-recovery rate limit per (email, hour) and (ip, hour).
    recovery-max-per-hour: ${IMIN_TICKET_RECOVERY_MAX_PER_HOUR:5}
    # The API's own public base URL (no trailing slash). Used to build absolute
    # QR / pkpass links the buyer's email client can fetch. Distinct from
    # imin.email.app-base-url which is the buyer-facing site.
    api-public-base-url: ${IMIN_API_PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,https://imin-webapp.vercel.app,https://imin-webapp-*.vercel.app,https://dashboard.imin.wtf,https://imin.wtf,https://www.imin.wtf,https://imin-public.vercel.app,https://imin-public-*.vercel.app}
  api:
    base-path: /api/v1
  auth:
    session-ttl-days: 30
  ratelimit:
    login:
      capacity: 5
      window-minutes: 15
    ai-concept:
      capacity: 10
      window-minutes: 60
    verification-resend:
      capacity: 3
      window-minutes: 15
    password-reset:
      capacity: 3
      window-minutes: 15
  media:
    enabled: ${MEDIA_ENABLED:true}
    bucket: ${R2_BUCKET:imin-media-dev}
    endpoint: ${R2_ENDPOINT:}
    region: ${R2_REGION:auto}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-url-prefix: ${R2_PUBLIC_URL_PREFIX:}

sentry:
  dsn: ${SENTRY_DSN:}
  enabled: false
  send-default-pii: false
  traces-sample-rate: 0.0
