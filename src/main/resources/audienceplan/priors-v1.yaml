  instagram_organic: unknown
# Tribe size inputs (national concert proxies, not club data).
tribe_size:
  music_listeners:        { low: 0.94, high: 0.94, source: "CNM", derived: true, note: "computed from CNM, confirm at M0-5" }
  bar_club_concert_goers: { low: 0.41, high: 0.44, source: "CNM", year: 2023 }
  # genres = the buckets this genre share describes (assumption: Ekhoscènes "electronic" is not split by bucket).
