# Style card for brutalist_techno — authored from the curated reference flyers.
# medium: mixed | recommended substyle: b_and_w
# subject: Raw monochrome brutalism: a worm's-eye concrete tower or a blown-out high-contrast human face, shot on grainy black-and-white, drowned in matte-black negative space with one acid accent color and machine-stamped type. Some sheets swap the hero for an industrial object or a stippled scientific specimen.
# notes: Five sheets split roughly evenly: two are object/architecture-led (worm's-eye concrete tower, stippled Saturn specimen), one is human-hero (acid-green threshold face portrait), one is abstract thermal smoke, one is a B&W street-photo collage. All share matte-black grounds, heavy grain, single acid accents (green or vermilion) and brutalist machine type — hence mixed medium, though B&W high-contrast photography is the dominant treatment.
medium: 'mixed'
palette:
  - [13, 13, 13]
  - [225, 60, 28]
  - [70, 209, 120]
hero_subjects:
  object:
    - 'dramatic upward worm''s-eye view of a raw exposed-concrete brutalist tower''s corner, ribbed balconies vanishing into a grainy black sky'
    - 'engraving-style stippled astronomical specimen (ringed planet) floating in black, fine etched dot texture'
    - 'industrial steel stairwell and concrete soffit shot head-on, single harsh light raking the formwork, film grain'
    - 'vintage halftone black-and-white city street of old sedans and concrete blocks, scratched and marbled like a worn photocopy'
    - 'single bare hanging warehouse bulb burning a hot highlight into total black surrounding void'
  abstract_graphic:
    - 'abstract orange-and-teal thermal smoke cloud sliced into vertical strips, heavy paper grain'
    - 'a blown-out high-contrast posterized face reduced to two acid-green tones, used as flat graphic texture on black'
    - 'a field of marbled toner streaks and photocopy dust over matte black, no discrete subject'
compositions:
  - 'hero photo confined to a hard-edged central rectangle, leaving wide matte-black margins on all four sides'
  - 'worm''s-eye hero occupying the lower-right diagonal, oversized headline anchored top-left, date stacked beneath'
  - 'full-bleed grainy hero with a giant condensed wordmark sitting on the bottom edge and a tiny date row above the footer'
  - 'narrow vertical sidebar of stacked artist names running up the left margin beside a central image block'
  - 'image split into 3-4 equal vertical strips with thin gaps, headline as a heavy band directly below the panel'
  - 'top half text-only with tracked-out small caps, bottom half a single bleed photo divided by a stamp or seal'
accents:
  - 'heavy coarse film grain across the whole sheet'
  - 'photocopy scratches, dust and marbled toner streaks'
  - 'extreme threshold / posterized halftone reducing a face to two tones'
  - 'engraving stipple and etched dot shading on the specimen image'
  - 'vertical strip-slicing of the hero panel with thin black gutters'
  - 'blown-out hard-flash highlight clipping to pure white'
palette_twists:
  - 'matte black ground with a single acid-green threshold hero and green type'
  - 'charcoal black with hot vermilion-orange headline and DJ names, hero left pure grayscale'
  - 'near-black paper grain, cream off-white type, and a muted orange/teal thermal accent'
  - 'black and red-oxide duotone with a scratched grunge overlay'
  - 'monochrome grayscale tower on black with one orange star glyph as the only color'
type_treatments:
  - 'oversized bold condensed grotesque headline in the accent color, set tight and all-caps'
  - 'tracked-out thin sans small caps with wide letter-spacing for secondary lines like SECRET LOC / AFTER PARTY'
  - 'monospace credits and codes in square brackets ([US], [LIVE], [BROTHERHOOD])'
  - 'repeated / echoed outlined wordmark stacked and overprinted for a glitch-stutter effect'
example_prompts:
  - 'Brutalist techno event poster, 4:5. Dramatic worm''s-eye black-and-white photograph of a raw exposed-concrete tower''s corner, ribbed balconies converging into a grainy black night sky, single harsh light raking the formwork, heavy 35mm film grain. Hero photo fills the lower-right diagonal; oversized bold condensed all-caps headline ''LABORATORIUM'' in hot vermilion-orange anchored top-left with a row of three four-point orange star glyphs above it; date ''10.02.24'' in orange small caps beneath. Two DJ names in orange condensed caps along the bottom edge. Matte black ground (13,13,13), vermilion accent (225,60,28), oversized negative space, crushed shadows, photocopy dust. No real brand or artist names.'
  - 'Brutalist techno poster, 4:5, matte pure-black background with oversized negative margins. Central hard-edged rectangle holds an extreme high-contrast threshold portrait of a single raver, eyes and hair dissolving into posterized acid-green halftone on black, coarse grain. Headline ''MECHTA'' set in heavy condensed acid-green caps top-center, date line below; a narrow left sidebar runs stacked artist names vertically in green; a small green-and-black QR square sits top-left. Monospace location tags in square brackets [LIVE][RU]. Two-tone black and acid-green (70,209,120), brutalist machine-stamped typography, no real brands.'
  - 'Brutalist techno poster, 4:5. Near-black paper-grain field, cream off-white ink. Center panel shows an abstract orange-and-teal thermal smoke cloud sliced into four thin vertical strips with black gutters, heavy grain. Giant condensed off-white wordmark sits on the bottom edge; below it a dense tour-date table in tiny monospace rows aligned in three columns. Wide empty black margins frame everything. Colors: black ground (13,13,13), cream type, muted orange/teal accent. Engraving grain, photocopy texture, oversized negative space, brutalist editorial layout, no real venue or artist names.'
human_policy: rare
human_style: figure_as_object
variant_plan:
  - { mode: object }
  - { mode: typographic }
  - { mode: abstract_graphic }
