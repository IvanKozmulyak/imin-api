# Style card for liquid_melodic — authored from the curated reference flyers.
# medium: illustration | recommended substyle: trained
# subject: Glossy liquid-chrome and 3D-rendered hero objects suspended in dreamy gradient haze — molten metallic flows, iridescent creatures, and surreal organic forms rendered with diffused atmospheric light and fine film grain.
# notes: All five references are object/abstract-led illustration and 3D render, not photography — no human heroes appear. Three are pure liquid-chrome or thermal-fluid abstractions (green-pink molten flow, blue-amber blob field) and two are surreal rendered objects (chained pom-pom clover, x-ray cactus-machine, iridescent beetle-dragonfly). The unifying traits are glossy organic flowing forms, iridescent gradient haze, diffused light and fine grain, so mediumPrimary is illustration and the substyle is trained.
medium: 'illustration'
palette:
  - [88, 220, 64]
  - [232, 150, 200]
  - [40, 60, 110]
hero_subjects:
  object:
    - 'a glossy 3D-rendered iridescent beetle-dragonfly creature with mirrored wings and metallic body'
    - 'a fuzzy green pom-pom clover orb wrapped in silver chains, spikes, and a smiley sticker'
    - 'an x-ray-style cactus cluster with pink blooms enclosing a small machine, on near-black ground'
    - 'a cluster of chrome mushrooms and bubble spheres glowing under purple and green laser light'
  abstract_graphic:
    - 'a molten liquid-chrome blob with green and pink iridescent ripples flowing across a black field'
    - 'a thermal-camera fluid surface of amber, blue and teal blobs melting into one another'
    - 'an edge-to-edge liquid-glass field, soft-focused gradients bending like mercury under haze'
compositions:
  - 'centered hero object floating in negative black space, type stacked top and bottom'
  - 'edge-to-edge liquid texture filling the whole frame with type reversed out in clear corners'
  - 'symmetrical mirror-axis creature centered with title overlaid across its body'
  - 'top-loaded headline block over an open liquid field, smaller credits sliding down the left margin'
  - 'diagram/blueprint-style framing with the hero specimen centered and tiny technical annotations around it'
  - 'hero pushed to one side leaving a glassy melted void for the date/lineup column'
accents:
  - 'fine film grain over the whole frame'
  - 'soft diffused glow / dreamy haze around light sources'
  - 'iridescent oil-slick color shift on metallic surfaces'
  - 'long-exposure light-trail smearing'
  - 'lens bloom and soft chromatic-aberration fringing'
  - 'subtle gradient banding in the haze'
palette_twists:
  - 'acid green melting into soft rose pink over black'
  - 'amber and teal thermal blobs bleeding into deep blue'
  - 'purple-to-green laser haze with magenta cores'
  - 'iridescent oil-slick chrome on near-black ground'
  - 'cool grey-blue liquid with warm sodium-amber veins'
type_treatments:
  - 'heavy condensed sans headline reversed white out of the dark liquid'
  - 'bold uppercase grotesk stacked in tight left-aligned blocks'
  - 'thin tracked-out caps for dates and venue lines along the margins'
  - 'rounded melted/blobby display lettering echoing the liquid forms for the main title'
example_prompts:
  - 'Event poster, 4:5 vertical. A molten liquid-chrome blob flowing edge to edge across the frame, acid-green ripples melting into soft rose-pink over a near-black field, iridescent oil-slick highlights catching diffused light. The surface bends like mercury under a haze of soft glow. Heavy condensed white sans-serif headline reversed out top-left reading ''CONTROL THEORY'', a tracked-out caps line beneath reading ''SAT JULY 30'', and a tight stacked lineup of DJ names down the right margin in thin uppercase grotesk. Fine film grain over the whole image, subtle gradient banding in the haze, dreamy and atmospheric, deep blacks. No real brand names.'
  - 'Event poster, 4:5 vertical. Centered glossy 3D-rendered iridescent beetle-dragonfly creature with mirrored chrome wings and a metallic body, surrounded by softly glowing mushrooms and floating bubble spheres lit by purple and green laser haze, magenta core glow at center. The creature floats in dark negative space. Rounded melted blobby display lettering overlaid across its body reading ''TRIBE SOUNDS'', a small pill-shaped date bar below reading ''06.DEC.2025 22H'', smaller credits along the bottom margin in thin tracked caps. Lens bloom, soft chromatic fringing, fine film grain, emotional and dreamy.'
  - 'Event poster, 4:5 vertical. A thermal-camera fluid surface filling the frame — amber, teal and cool grey-blue blobs melting into one another with warm sodium-amber veins, everything soft-focused and diffused like liquid glass. Bold uppercase grotesk headline stacked top-left reversed white reading ''IN STORE'', three left-aligned date-and-name blocks down the lower left in mixed-weight caps, venue address tracked out along the bottom. Fine film grain, gentle gradient banding, dreamy haze, atmospheric and calm. No real venue names.'
human_policy: forbidden
variant_plan:
  - { mode: object }
  - { mode: abstract_graphic }
  - { mode: typographic }
