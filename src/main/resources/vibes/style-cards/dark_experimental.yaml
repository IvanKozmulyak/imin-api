# Style card for dark_experimental — authored from the curated reference flyers.
# medium: photo | recommended substyle: motion_blur
# subject: A single human figure rendered as a tormented, distorted photograph — a motion-blurred crowd, a screaming halftone face, or hands clenched over a head — pushed into near-monochrome darkness with grain, glitch and crushed contrast.
# notes: All five references are photo-led with a human hero (motion-blurred crowd, screaming halftone face, head-clutching glitch figure, double-exposed clenched hands/face, sliced reaching hands). They are near-monochrome or duotone, drenched in grain, and use distortion (blur, glitch, double-exposure, halftone) — so the medium is photo and the best Recraft substyle is motion_blur, with chromatic-glitch and grain as the recurring accents.
medium: 'photo'
palette:
  - [14, 14, 16]
  - [216, 214, 208]
  - [201, 86, 41]
hero_subjects:
  people:
    - 'a person clutching their own head with both hands, long-exposure smear pulling the fingers into red-and-cyan chromatic ghosts, face dissolving into blur'
    - 'a tight crowd of dancers shot at slow shutter so bodies melt into a single grey motion-blurred mass against pure black'
    - 'a screaming open-mouthed face in extreme high-contrast halftone, eyes lost to shadow, skin reduced to coarse dot texture'
    - 'two bare hands reaching toward each other across a pale grey field, fingertips almost touching, sliced into vertical strips'
    - 'a profile portrait double-exposed with a second face, features overlapping into one ambiguous head emerging from black'
    - 'a lone figure seen from behind, shoulders and skull lit by a single hard rim of light, the rest swallowed by darkness'
  object:
    - 'a pair of clenched fists pressed together over an unseen mouth, knuckles raking light out of total black'
    - 'a plaster head sculpture wrapped in red and teal grasping hands, smooth surface against grain'
    - 'a tangle of overlapping fingers forming an abstract knot of skin in low key light'
    - 'an extreme macro of an open screaming mouth, teeth catching the only highlight in the frame'
    - 'a vertical row of paper strips, each carrying a fragment of a photographed hand'
compositions:
  - 'hero photo floating in the dead-center of a pure-black field, large type stacked top and bottom margins'
  - 'monstrously large display title bleeding off the top edge, body crop filling the lower two-thirds'
  - 'vertical text column running down one side while the distorted figure occupies the center'
  - 'subject sliced into even vertical strips that interleave with the background, title set in the gaps'
  - 'duotone face cropped tight, head bleeding off both side edges, single word straddling the eyes'
  - 'small caption clusters and a dictionary-style definition anchored bottom-left under a centered hero'
  - 'huge letterform stacked one-glyph-per-line down the right margin beside a dark photo'
  - 'hairline orbit lines and tiny annotation labels scattered around a centered figure on light grain'
accents:
  - 'heavy film grain and photocopy noise over the whole frame'
  - 'red/cyan chromatic-aberration glitch on the figure edges'
  - 'long-exposure motion blur smearing limbs'
  - 'double-exposure ghosting of two overlapping faces'
  - 'coarse halftone-dot duotone screen'
  - 'crushed-black shadows clipping detail to pure void'
palette_twists:
  - 'near-black void (14,14,16) with bone-white type'
  - 'cyan ground (40,150,200) against burnt-orange halftone subject (201,86,41)'
  - 'warm off-white paper grain (216,214,208) with oxblood-red display type'
  - 'pure greyscale, crushed blacks and a single blown highlight'
  - 'charcoal field with one acid-yellow text accent'
type_treatments:
  - 'heavy grotesque sans in acid yellow, tightly set, pinned to top and bottom margins'
  - 'condensed blackletter / gothic display title in oxblood red'
  - 'outsized light-weight sans set one glyph per line stacked vertically'
  - 'chunky black slab capitals sliced and interrupted by the image strips, plus tiny mono caption blocks and barcode/edition marks'
example_prompts:
  - 'Event poster, 4:5 vertical, pure black field edge to edge, heavy film grain over everything. Center: a tight crowd of dancers shot on a slow shutter so the bodies melt into one ghostly grey motion-blurred mass, no sharp faces, just smeared light on shoulders and a hand raised mid-air, crushed blacks swallowing the edges. Top margin: bold grotesque sans title in acid yellow reading "NULL STATE" set tight in two lines. Bottom margin: large yellow date "22.11.2025" with a thin rule and small white caption underneath. Cold, cerebral, deconstructed, monochrome with a single yellow accent.'
  - 'Event poster, 4:5 vertical, warm off-white paper with coarse photocopy grain. Hero: a person clutching their own head with both hands, the fingers and arms smeared into red-and-cyan chromatic-aberration ghosts by long exposure, the face dissolving into blur. Title across the top in condensed oxblood-red blackletter display type reading "DISTORTED SIGNAL", broken to two lines. Tiny red annotation labels float beside the head, a hairline orbit curve loops behind the figure, small mono caption block and a barcode pinned bottom corners. Avant-garde, cold, glitch.'
  - 'Event poster, 4:5 vertical, cyan ground against a high-contrast burnt-orange and black halftone-dot portrait of a screaming open-mouthed face cropped tight and bleeding off both side edges, eyes lost to shadow, skin reduced to coarse dots, paper visibly creased and torn. A single heavy black slab word "RUPTURE" straddles the eyes, its letters interrupted by the figure. Small black date and venue line set quietly in the lower corner. Crushed contrast, screenprint texture, deconstructed and raw.'
human_policy: required
human_style: abstracted
variant_plan:
  - { mode: people }
  - { mode: object }
  - { mode: typographic }
