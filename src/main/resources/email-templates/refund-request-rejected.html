<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Your refund request</title>
</head>
<body style="margin: 0; padding: 0; background: #f4f2fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #11091f;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="padding: 24px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="background: #ffffff; border: 1px solid #e8e4f1; border-radius: 12px; padding: 28px;">
          <tr><td>
            <div style="font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #7a738f;">REFUND REQUEST UPDATE</div>
            <h1 style="margin: 8px 0 16px; font-size: 22px; line-height: 1.3; color: #11091f;">The organiser couldn't approve your refund</h1>

            <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6;">
              Hi &mdash; the organiser reviewed your refund request and was unable to approve it. Their note:
            </p>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin: 0 0 16px; background: #f4f2fa; border-left: 3px solid #d4cee6; border-radius: 4px;">
              <tr><td style="padding: 14px 16px; font-size: 14px; line-height: 1.6; color: #4a4358; white-space: pre-wrap;">{{decisionNote}}</td></tr>
            </table>

            <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #7a738f;">
              If you'd like to discuss this further, replying to this email reaches the organiser.
            </p>
          </td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
