<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light" />
  <title>{{title}}</title>
</head>
<body style="margin:0; padding:0; background:#f4f2fa; font-family:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color:#11091f; -webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f2fa; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%; background:#ffffff; border:1px solid #d4cee6; border-radius:10px; overflow:hidden;">
          <tr><td style="padding:24px 32px 0; text-align:left;"><span style="font-size:18px; font-weight:700; letter-spacing:-0.3px; color:#11091f;">imin</span><span style="font-size:18px; font-weight:700; color:#2d5cff;">.wtf</span></td></tr>
          <tr><td style="padding:24px 32px 0;"><h1 style="margin:0; font-size:22px; font-weight:700; letter-spacing:-0.4px; color:#11091f; line-height:1.25;">{{title}}</h1></td></tr>
          <tr><td style="padding:10px 32px 0;"><p style="margin:0; font-size:14px; line-height:1.6; color:#11091f;">{{measureLine}}</p></td></tr>
          <tr><td style="padding:10px 32px 0;"><p style="margin:0; font-size:14px; line-height:1.6; color:#11091f;">{{scopeLine}}</p></td></tr>
          <tr><td style="padding:10px 32px 0;"><p style="margin:0; font-size:14px; line-height:1.6; color:#11091f;">{{effectLines}}</p></td></tr>
          <tr><td style="padding:10px 32px 0;"><p style="margin:0; font-size:14px; line-height:1.6; color:#11091f;">{{otherActiveLine}}</p></td></tr>
          <tr><td style="padding:10px 32px 0;"><p style="margin:0; font-size:14px; line-height:1.6; color:#11091f;">{{decidedLine}}</p></td></tr>
          <tr>
            <td style="padding:24px 32px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background:#2d5cff; border-radius:6px;">
                    <a href="{{dashboardUrl}}" style="display:inline-block; padding:11px 18px; font-size:13px; font-weight:600; color:#ffffff; text-decoration:none;">Abrir tu panel &rarr;</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
