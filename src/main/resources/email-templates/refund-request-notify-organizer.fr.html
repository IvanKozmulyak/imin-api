<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nouvelle demande de remboursement</title>
</head>
<body style="margin: 0; padding: 0; background: #f4f2fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #11091f;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="padding: 24px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="background: #ffffff; border: 1px solid #e8e4f1; border-radius: 12px; padding: 28px;">
          <tr><td>
            <div style="font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #7a738f;">NOUVELLE DEMANDE DE REMBOURSEMENT</div>
            <h1 style="margin: 8px 0 16px; font-size: 22px; line-height: 1.3; color: #11091f;">Un acheteur a demandé un remboursement</h1>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin: 0 0 16px; background: #f4f2fa; border: 1px solid #d4cee6; border-radius: 8px; padding: 16px;">
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Événement</td><td align="right" style="padding: 4px 0; font-size: 14px; font-weight: 600; color: #11091f;">{{eventName}}</td></tr>
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Acheteur</td><td align="right" style="padding: 4px 0; font-size: 14px; color: #11091f;">{{buyerEmail}}{{phoneLine}}</td></tr>
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Motif</td><td align="right" style="padding: 4px 0; font-size: 14px; color: #11091f;">{{reason}}</td></tr>
            </table>

            <div style="font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #7a738f;">NOTE DE L'ACHETEUR</div>
            <p style="margin: 8px 0 20px; font-size: 14px; line-height: 1.6; color: #11091f; white-space: pre-wrap;">{{explanation}}</p>

            <p style="margin: 0;">
              <a href="{{dashboardUrl}}" style="display: inline-block; padding: 12px 18px; background: #16B877; color: #ffffff; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600;">Ouvrir dans le tableau de bord</a>
            </p>
          </td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
