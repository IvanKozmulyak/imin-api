<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>[imin] new organizer</title>
</head>
<body style="margin: 0; padding: 0; background: #f4f2fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #11091f;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="padding: 24px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="background: #ffffff; border: 1px solid #e8e4f1; border-radius: 12px; padding: 28px;">
          <tr><td>
            <div style="font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #7a738f;">[imin] INTERNAL</div>
            <h1 style="margin: 8px 0 16px; font-size: 20px; line-height: 1.3; color: #11091f;">New organizer</h1>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin: 0; background: #f4f2fa; border: 1px solid #d4cee6; border-radius: 8px; padding: 16px;">
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Name</td><td align="right" style="padding: 4px 0; font-size: 14px; font-weight: 600; color: #11091f;">{{name}}</td></tr>
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Email</td><td align="right" style="padding: 4px 0; font-size: 14px; color: #11091f;">{{email}}</td></tr>
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Organization</td><td align="right" style="padding: 4px 0; font-size: 14px; color: #11091f;">{{organization}}</td></tr>
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Country</td><td align="right" style="padding: 4px 0; font-size: 14px; color: #11091f;">{{country}}</td></tr>
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Sign-up method</td><td align="right" style="padding: 4px 0; font-size: 14px; color: #11091f;">{{method}}</td></tr>
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Signed up</td><td align="right" style="padding: 4px 0; font-size: 14px; color: #11091f; font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace;">{{signedUp}}</td></tr>
              <tr><td style="padding: 4px 0; font-size: 13px; color: #7a738f;">Time</td><td align="right" style="padding: 4px 0; font-size: 14px; color: #11091f; font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace;">{{when}}</td></tr>
            </table>
          </td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
